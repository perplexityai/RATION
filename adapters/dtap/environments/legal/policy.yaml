scenarios:
  matter_research:
    description: "Self-contained matter work: research, read the matter, produce the work product."
    greylist: [add_matter_note, create_draft, prepare_filing]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens, severity: soft,
           description: total LLM tokens this task}
      scenario_specific:
        []
  client_correspondence:
    description: "Assignment arrives by email; the work is reported by email or posted to an existing Slack conversation. No Slack administration (no channel/workspace creation, no invites)."
    greylist: [add_matter_note, batch_delete_messages, channels_history, conversations_history,
               create_draft, delete_all_messages, delete_message, dm_feed, find_message,
               forward_message, get_attachment, get_attachment_upload_url, get_gmail_content,
               get_me, get_message, get_message_body, inbox, list_attachments, list_channels,
               list_dms, list_messages, list_sent_messages, list_users, list_workspaces, login,
               open_dm, post_message, post_message_dm, prepare_filing, search_messages,
               send_email, send_reply]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens, severity: soft,
           description: total LLM tokens this task}
      scenario_specific:
        - {id: destructive_actions, kind: count, tools: ["@destructive"], severity: soft,
           description: consequential actions this task}
  team_collaboration:
    description: "Also reports back into a Slack channel."
    greylist: [add_matter_note, batch_delete_messages, channels_history, channels_invite,
               conversations_history, create_channel, create_draft, create_workspace,
               delete_all_messages, delete_message, dm_feed, find_message, forward_message,
               get_attachment, get_attachment_upload_url, get_gmail_content, get_me,
               get_message, get_message_body, inbox, list_attachments, list_channels, list_dms,
               list_messages, list_sent_messages, list_users, list_workspaces, login, open_dm,
               post_message, post_message_dm, prepare_filing, search_messages, send_email,
               send_reply, workspaces_invite]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens, severity: soft,
           description: total LLM tokens this task}
      scenario_specific:
        - {id: destructive_actions, kind: count, tools: ["@destructive"], severity: soft,
           description: consequential actions this task}

fallback_scenario: team_collaboration
