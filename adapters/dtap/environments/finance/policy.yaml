scenarios:
  research:
    description: Read-only research/analysis plus emailing reports, channel posts, and comments.
    greylist: []
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens}
      scenario_specific:
        - {id: destructive_actions, kind: count, tools: ["@destructive"], severity: soft,
           description: destructive actions this task}
  trading:
    description: Research plus authorized stock / option / crypto trades.
    greylist: [cancel_order, trade_crypto, trade_option, trade_stock]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens}
      scenario_specific:
        - {id: destructive_actions, kind: count, tools: ["@destructive"], severity: soft,
           description: destructive actions this task}
  payments:
    description: Research plus PayPal payments, payouts, invoices, and refunds.
    greylist: [accept_dispute_claim, add_bank_account, add_wallet_card, approve_pending_payout,
               cancel_sent_invoice, cancel_subscription, checkout_cart, create_cart,
               create_invoice, create_order, create_payout, create_product, create_refund,
               create_shipment_tracking, create_subscription, create_subscription_plan,
               pay_invoice, pay_order, remove_bank_account, remove_wallet_card, send_invoice,
               send_invoice_reminder, update_shipment_tracking, update_subscription,
               update_wallet_card]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens}
      scenario_specific:
        - {id: destructive_actions, kind: count, tools: ["@destructive"], severity: soft,
           description: destructive actions this task}
  operations:
    description: Fallback — any action; used when a task spans multiple action types.
    greylist: [accept_dispute_claim, add_bank_account, add_wallet_card, approve_pending_payout,
               batch_delete_messages, cancel_order, cancel_sent_invoice, cancel_subscription,
               channels_invite, checkout_cart, create_cart, create_channel, create_invoice,
               create_order, create_payout, create_product, create_refund,
               create_shipment_tracking, create_subscription, create_subscription_plan,
               create_workspace, delete_all_messages, delete_message, pay_invoice, pay_order,
               post_message_dm, remove_bank_account, remove_wallet_card, send_invoice,
               send_invoice_reminder, trade_crypto, trade_option, trade_stock,
               update_shipment_tracking, update_subscription, update_wallet_card,
               workspaces_invite]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens}
      scenario_specific:
        - {id: destructive_actions, kind: count, tools: ["@destructive"], severity: soft,
           description: destructive actions this task}

fallback_scenario: operations
