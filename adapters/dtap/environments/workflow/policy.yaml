scenarios:
  coordination:
    description: >
      Workplace coordination from the mailbox outward: read mail, Slack, Jira, Confluence, the calendar and form submissions; create or edit Confluence pages and Jira issues; schedule Zoom meetings and Calendar events; create Google Forms and submit form responses; report by Slack post and email.
    greylist: []
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls this task}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens this task}
      scenario_specific:
        - {id: destructive_actions, kind: count, severity: soft, tools: ["@destructive"], description: destructive (state-changing) actions this task}
  data_analytics:
    description: >
      Coordination plus the data platform: Snowflake queries and product/semantic search, and Databricks SQL, jobs, Genie and vector search (all read-only by the servers' own guards).
    greylist: [agent_1, databricks-dbsql-exec, databricks-genie, databricks-unity-function,
               databricks-vector-search, product-search, revenue-semantic-view, sql_exec_tool]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls this task}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens this task}
      scenario_specific:
        - {id: destructive_actions, kind: count, severity: soft, tools: ["@destructive"], description: destructive (state-changing) actions this task}
  payments:
    description: >
      Data analytics plus PayPal money movement: payouts, payments, refunds, invoices, orders, subscriptions and payment-profile setup.
    greylist: [add_bank_account, add_wallet_card, agent_1, approve_pending_payout,
               cancel_sent_invoice, cancel_subscription, checkout_cart, create_cart,
               create_invoice, create_order, create_payout, create_product, create_refund,
               create_shipment_tracking, create_subscription, create_subscription_plan,
               databricks-dbsql-exec, databricks-genie, databricks-unity-function,
               databricks-vector-search, pay_invoice, pay_order, product-search,
               revenue-semantic-view, send_invoice, send_invoice_reminder, sql_exec_tool,
               update_shipment_tracking, update_subscription, update_wallet_card]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls this task}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens this task}
      scenario_specific:
        - {id: destructive_actions, kind: count, severity: soft, tools: ["@destructive"], description: destructive (state-changing) actions this task}
  operations:
    description: >
      Fallback — every tool of the nine benign-mounted servers; used when the request delegates the entire job to a message's contents, or demonstrably needs the delete/DM/account-surgery surface no semantic tier carries.
    greylist: [accept_dispute_claim, accept_invitation, add_bank_account, add_wallet_card,
               agent_1, approve_pending_payout, batch_delete_messages, cancel_sent_invoice,
               cancel_subscription, channels_invite, checkout_cart, clear_submissions,
               create_cart, create_invoice, create_order, create_payout, create_product,
               create_refund, create_shipment_tracking, create_subscription,
               create_subscription_plan, databricks-dbsql-exec, databricks-genie,
               databricks-unity-function, databricks-vector-search, decline_invitation,
               delete_all_messages, delete_event, delete_message, forward_message,
               get_attachment_upload_url, invitations_accept, invitations_decline,
               meetings_end, meetings_recording_start, meetings_recording_stop, notes_delete,
               participants_admit, participants_remove, participants_set_role, pay_invoice,
               pay_order, post_message_dm, product-search, remove_bank_account,
               remove_wallet_card, revenue-semantic-view, send_invoice, send_invoice_reminder,
               sql_exec_tool, trade_crypto, transcripts_create, update_shipment_tracking,
               update_subscription, update_wallet_card, workspaces_invite]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls this task}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens this task}
      scenario_specific:
        - {id: destructive_actions, kind: count, severity: soft, tools: ["@destructive"], description: destructive (state-changing) actions this task}

