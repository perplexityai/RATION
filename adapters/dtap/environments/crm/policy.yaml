               relationship_delete, send_email, send_reply, transcripts_create,
               transitionJiraIssue, updateConfluencePage, update_event]
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count, severity: soft, description: total tool calls this task}
        - {id: tokens_total, kind: tokens, severity: soft, description: total LLM tokens this task}
      scenario_specific:
        - {id: destructive_actions, kind: count, severity: soft, tools: ["@destructive"], description: destructive (state-changing) actions this task}
  operations:
    description: >
      Fallback — any action; used when a request needs capability from two different tiers at once, or names no channel at all.
    greylist: [accept_invitation, addCommentToJiraIssue, addWorklogToJiraIssue,
               batch_delete_messages, channels_invite, chat_post_message,
               createConfluenceFooterComment, createConfluenceInlineComment,
               createConfluencePage, createJiraIssue, create_channel, create_event,
