domain: asb/aerospace_engineer_agent
interface_artifacts:
  tools: ../../../../benchmarks/asb/environments/aerospace_engineer_agent/tools.json
adapter_artifacts:
  provisioner: ../../config/provisioner.yaml
  feedback: ../../config/feedback.yaml
description: Analyze, design, test, and update aerospace systems.
provisioner_guidance: This environment has one policy scenario, 'aerospace_engineering';
  route its trusted task to that scenario.
