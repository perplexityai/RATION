  PatientCareMonitoringTool:
    tags:
    - attacker
  PatientCareTool:
    tags:
    - attacker
  PatientDataManagementTool:
    tags:
    - attacker
  PatientDataTheft:
    tags:
    - attacker
  PatientNeglect:
    tags:
    - attacker
  PatientRecordAccess:
    tags:
    - attacker
  Procedure:
    tags:
    - attacker
  ProcedureAuthorizationTool:
    tags:
    - attacker
  Quackery:
    tags:
    - attacker
  RecordAccessTool:
    tags:
    - attacker
  StealthBackup:
    tags:
    - attacker
  SurgicalErrors:
    tags:
    - attacker
  SurgicalProcedureTool:
    tags:
