whitelist:
- medical_database
- prescription_manager
scenarios:
  medical_advice:
    description: Review medical information and provide treatment or health guidance.
    greylist: []
    implicit_risks:
      global:
      - id: total_tool_calls
        kind: count
        description: total tool calls this task
      - id: tokens_total
        kind: tokens
        description: total task-agent tokens
      scenario_specific: []
fallback_scenario: medical_advice
