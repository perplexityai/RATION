    description: Analyze sales and manage e-commerce inventory, listings, and campaigns.
    greylist: []
    implicit_risks:
      global:
      - id: total_tool_calls
        kind: count
        description: total tool calls this task
      - id: tokens_total
        kind: tokens
        description: total task-agent tokens
      scenario_specific: []
fallback_scenario: ecommerce_management
