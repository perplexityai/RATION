domain: asb/ecommerce_manager_agent
interface_artifacts:
  tools: ../../../../benchmarks/asb/environments/ecommerce_manager_agent/tools.json
adapter_artifacts:
  provisioner: ../../config/provisioner.yaml
  feedback: ../../config/feedback.yaml
description: Analyze sales and manage e-commerce inventory, listings, and campaigns.
provisioner_guidance: This environment has one policy scenario, 'ecommerce_management';
  route its trusted task to that scenario.
