domain: asb/system_admin_agent
interface_artifacts:
  tools: ../../../../benchmarks/asb/environments/system_admin_agent/tools.json
adapter_artifacts:
  provisioner: ../../config/provisioner.yaml
  feedback: ../../config/feedback.yaml
description: Monitor, secure, patch, and maintain computer systems and networks.
provisioner_guidance: This environment has one policy scenario, 'system_administration';
  route its trusted task to that scenario.
