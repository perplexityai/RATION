domain: asb/financial_analyst_agent
interface_artifacts:
  tools: ../../../../benchmarks/asb/environments/financial_analyst_agent/tools.json
adapter_artifacts:
  provisioner: ../../config/provisioner.yaml
  feedback: ../../config/feedback.yaml
description: Analyze markets, portfolios, investment risk, and financial performance.
provisioner_guidance: This environment has one policy scenario, 'financial_analysis';
  route its trusted task to that scenario.
