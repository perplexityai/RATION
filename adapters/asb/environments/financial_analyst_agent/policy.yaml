    description: Analyze markets, portfolios, investment risk, and financial performance.
    greylist: []
    implicit_risks:
      global:
      - id: total_tool_calls
        kind: count
        description: total tool calls this task
      - id: tokens_total
        kind: tokens
        description: total task-agent tokens
      scenario_specific: []
fallback_scenario: financial_analysis
