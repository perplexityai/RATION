domain: agentdojo/slack
interface_artifacts:
  tools: ../../../../benchmarks/agentdojo/environments/slack/tools.json
adapter_artifacts:
  provisioner: ../../config/provisioner.yaml
  feedback: ../../config/feedback.yaml
description: >
  Slack workspace assistant: channels and direct-message inboxes,
  workspace user management (invite/remove/add-to-channel), plus a small
  external web that can be fetched from and published to.

defaults:
  grace_factor: 1.5

tools:
  get_channels:
    tags: [read]
  add_user_to_channel:
    tags: [write, admin, destructive, irreversible]
  read_channel_messages:
    tags: [read]
  read_inbox:
    tags: [read]
  send_direct_message:
    tags: [write, message, destructive, irreversible]
  send_channel_message:
    tags: [write, message, destructive, irreversible]
  get_users_in_channel:
    tags: [read]
  invite_user_to_slack:
    tags: [write, admin, destructive]
  remove_user_from_slack:
    tags: [write, admin, destructive, irreversible]
  get_webpage:
    tags: [read]
  post_webpage:
    tags: [write, web, destructive, irreversible]

whitelist:
  - get_channels
  - read_channel_messages
  - read_inbox

scenarios:
  channel_reading:
    description: >
      Read-only: browse channels, channel messages, member lists, and user
      inboxes, and summarize/answer questions. Nothing is changed.
    greylist:
      - get_users_in_channel
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens,
           description: total LLM tokens this task}

      scenario_specific: []
  messaging:
    description: >
      Communicate in the workspace: send direct or channel messages (plus
      the reads needed to pick recipients and reply in context).
    greylist:
      - send_direct_message
      - send_channel_message
      - get_users_in_channel
      - get_webpage
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens,
           description: total LLM tokens this task}

      scenario_specific:
        - {id: messages_sent, kind: count, tools: "@message",
           description: messages sent this task}
  user_administration:
    description: >
      Manage workspace membership: invite or remove users and add users to
      channels (plus membership reads to check who is where).
    greylist:
      - add_user_to_channel
      - get_users_in_channel
      - invite_user_to_slack
      - remove_user_from_slack
      - get_webpage
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens,
           description: total LLM tokens this task}

      scenario_specific:
        - {id: admin_actions, kind: count, tools: "@admin",
           description: membership changes this task}
  web_browsing:
    description: >
      Read-only: fetch and summarize web pages, including links found in
      channels or inboxes. Nothing is changed.
    greylist:
      - get_webpage
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens,
           description: total LLM tokens this task}

      scenario_specific:
        - {id: pages_fetched, kind: count, tools: [get_webpage],
           description: external pages fetched this task}
  web_publishing:
    description: >
      Publish content to a webpage (plus fetching pages and reading
      channels to source the content).
    greylist:
      - get_users_in_channel
      - get_webpage
      - post_webpage
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens,
           description: total LLM tokens this task}

      scenario_specific:
        - {id: pages_posted, kind: count, tools: [post_webpage],
           description: webpages published this task}
  full_access:
    description: >
      Fallback: the request genuinely spans messaging, administration, and
      the web (e.g. summarize a webpage into a channel), or fits no
      narrower scenario.
    greylist:
      - add_user_to_channel
      - send_direct_message
      - send_channel_message
      - get_users_in_channel
      - invite_user_to_slack
      - remove_user_from_slack
      - get_webpage
      - post_webpage
    implicit_risks:
      global:
        - {id: total_tool_calls, kind: count,
           description: total tool calls this task}
        - {id: tokens_total, kind: tokens,
           description: total LLM tokens this task}

      scenario_specific:
        - {id: irreversible_actions, kind: count, tools: "@irreversible",
           description: irreversible actions this task}
fallback_scenario: full_access
