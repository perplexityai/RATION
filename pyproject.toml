[project]
name = "ration"
version = "0.1.0"
description = "RATION: Towards Quantitative Risk-Based Access Control for AI Agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = ["pyyaml>=6", "openai>=1.60", "httpx>=0.27"]

[project.optional-dependencies]
agentdojo = ["agentdojo==0.1.35"]

[project.urls]
Paper = "https://arxiv.org/abs/2610.24311"
Repository = "https://github.com/perplexityai/RATION"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ration"]
